  今年去北京看法文/法文活动周尤为让我印象深刻的两部，第一部提供的这个思路尤为新颖。具体展开到叙事上很有意思，但对于影片本身我觉得很难去下一个判断。
  <br/>
  另外一部就是新凯旋门了，我极其喜欢的一部反类型的叙事。艺术信仰拍出来能感受到的偏执，具体历史背景不了解法国但可能沾了点艺术加工吧。你能跟ta共鸣并且感受到这个无奈和最终的结局是令我非常有感觉的，与体制的抗衡和朋友间的背道在我看到最后的有股很难明说的感觉。我认为我完全代入进去了并且跟主角有一样的感受
